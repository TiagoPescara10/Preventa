name: Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  lint-y-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: preventa
          POSTGRES_USER: preventa
          POSTGRES_PASSWORD: preventa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preventa -d preventa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://preventa:preventa@localhost:5432/preventa

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Migraciones al dia
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: coverage run -m pytest && coverage report
